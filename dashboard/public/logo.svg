<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 64" width="340" height="64" role="img" aria-label="Continuum">
  <!-- Horizontal lockup: mark + wordmark. The trace exits the mark and becomes the baseline the
       wordmark sits on, so the line reads as continuous across the whole lockup — which is the
       one idea the name carries. -->
  <title>Continuum</title>

  <rect x="1.25" y="1.25" width="61.5" height="61.5" rx="15" fill="#0A0F13"/>
  <rect x="1.25" y="1.25" width="61.5" height="61.5" rx="15" fill="none" stroke="#24313A" stroke-width="1.5"/>
  <path d="M12 27.5 L24 25.5 L36 30.5 L46 38 L53 44.5 L53 26.5 L46 24 L36 21.5 L24 18.5 L12 21 Z"
        fill="#6FD3C7" fill-opacity="0.17"/>
  <path d="M12 24.2 C21 22.2, 27.5 28.5, 36 26.2 C44.5 23.9, 48 35.5, 53 35.4"
        fill="none" stroke="#6FD3C7" stroke-width="2.9" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="53" cy="35.4" r="3.6" fill="#6FD3C7"/>

  <text x="80" y="35"
        font-family="Archivo, 'Segoe UI', system-ui, sans-serif"
        font-size="27" font-weight="600" letter-spacing="-0.9"
        fill="#E4EDF0">Continuum</text>
  <text x="81" y="50"
        font-family="'IBM Plex Mono', ui-monospace, monospace"
        font-size="9.5" letter-spacing="1.7"
        fill="#6FD3C7">CONTINUOUS CREDIT · 0G</text>
</svg>
