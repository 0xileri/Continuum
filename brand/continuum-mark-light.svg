<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Continuum">
  <!-- The mark is the product: a score trace inside its confidence band, the band widening to the
       right because uncertainty grows as evidence ages. Not a badge — a rating is a stamp, this
       is a measurement. -->
  <title>Continuum</title>
  <rect x="1.25" y="1.25" width="61.5" height="61.5" rx="15" fill="#FFFFFF"/>
  <rect x="1.25" y="1.25" width="61.5" height="61.5" rx="15" fill="none" stroke="#D3DEDE" stroke-width="1.5"/>
  <!-- confidence band -->
  <path d="M12 20.0 C21 17.8, 27.5 23.6, 36 20.7 C44.5 17.4, 48 28.0, 53 26.9 L53 43.9 C48 43.0, 44.5 30.4, 36 31.7 C27.5 33.4, 21 26.6, 12 28.4 Z"
        fill="#1E8C7F" fill-opacity="0.22"/>
  <!-- the trace -->
  <path d="M12 24.2 C21 22.2, 27.5 28.5, 36 26.2 C44.5 23.9, 48 35.5, 53 35.4"
        fill="none" stroke="#14655B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- the current reading -->
  <circle cx="53" cy="35.4" r="3.6" fill="#14655B"/>
</svg>
