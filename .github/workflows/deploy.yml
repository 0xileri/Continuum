# Deploy the dashboard to Railway on every push to main.
#
# WHY THIS EXISTS
#
# Railway's own push-to-deploy is a GitHub App webhook, and it was never firing for this repo —
# every deploy so far has needed the service source re-attached by hand, which is exactly the thing
# you do not want to discover an hour before a demo. Granting the Railway GitHub App access is the
# proper fix, but it needs admin on 0xileri/Continuum; this workflow does not, so the repo can
# deploy itself either way. If the App is later connected, this becomes redundant rather than
# harmful — Railway skips a build whose source is already current.
#
# SETUP (one secret, one time)
#
#   1. Railway dashboard -> project "continuum" -> Settings -> Tokens -> Create token
#      (a PROJECT token, scoped to this project; it cannot touch anything else)
#   2. GitHub -> 0xileri/Continuum -> Settings -> Secrets and variables -> Actions
#      -> New repository secret, named RAILWAY_TOKEN
#
# Nothing else is needed: the project and service are pinned below, and the token never leaves
# GitHub's secret store.

name: deploy

on:
  push:
    branches: [main]
    # The 0G bridge, the contracts and the docs do not affect the deployed image, and a deploy per
    # README typo wastes build minutes. Adjust if the Dockerfile's COPY set changes.
    paths:
      - 'continuum/**'
      - 'dashboard/**'
      - 'data/public/**'
      - 'deployments/**'
      - 'Dockerfile'
      - '.github/workflows/deploy.yml'
  # So a deploy can be forced from the Actions tab without an empty commit — useful when the only
  # change is a Railway-side variable.
  workflow_dispatch:

# One deploy at a time, and a newer push supersedes an in-flight one rather than racing it.
concurrency:
  group: railway-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Guard against a missing token
        # A clear failure here beats a confusing one from the CLI, and says exactly what to add.
        run: |
          if [ -z "${{ secrets.RAILWAY_TOKEN }}" ]; then
            echo "::error::RAILWAY_TOKEN is not set. Add it under Settings -> Secrets and"
            echo "::error::variables -> Actions. Create the token in the Railway dashboard:"
            echo "::error::project 'continuum' -> Settings -> Tokens."
            exit 1
          fi

      - name: Install the Railway CLI
        run: npm install -g @railway/cli

      - name: Stamp the commit onto the service
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        # `railway up` builds remotely, so the Dockerfile's ARG GIT_COMMIT never receives this
        # SHA — it would stay "unknown" and the verify step could never pass. A service variable
        # overrides the image's ENV default at runtime, which gets the commit to /health without
        # needing build args over the wire. --skip-deploys because the next step deploys anyway.
        run: |
          railway variables             --set "CONTINUUM_BUILD_COMMIT=${GITHUB_SHA}"             --service 5ce5968b-d54d-41cc-99ee-d1c74abdfc22             --environment 97836e17-e95a-4a1f-a753-c9fbd6f05d42             --skip-deploys

      - name: Deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        # `up` uploads this checkout and builds it, so the deployed image always matches the commit
        # that triggered the run. `redeploy` would reuse the previous build and silently ship stale
        # code — which is the failure this workflow exists to prevent, so it must not be used here.
        run: |
          railway up \
            --service 5ce5968b-d54d-41cc-99ee-d1c74abdfc22 \
            --environment 97836e17-e95a-4a1f-a753-c9fbd6f05d42 \
            --ci

      - name: Verify the deployed commit is this one
        # Railway reports success when the container starts, which is not the same as the new code
        # being served — a healthy old container passes that check happily. /health reports the
        # commit stamped into the image at build time, so this waits for the site to actually be
        # running THIS commit rather than merely responding.
        run: |
          URL="https://continuumonx.up.railway.app"
          WANT="${GITHUB_SHA}"
          echo "expecting build_commit=$WANT"

          for i in $(seq 1 40); do
            GOT=$(curl -fsS -m 10 "$URL/health" 2>/dev/null                   | python3 -c 'import json,sys; print(json.load(sys.stdin).get("build_commit",""))'                   2>/dev/null || true)
            if [ "$GOT" = "$WANT" ]; then
              echo "deployed: $GOT"
              curl -fsS -m 10 "$URL/og"                 | python3 -c 'import json,sys; d=json.load(sys.stdin); print("publications:", d["onchain_count"], "network:", d["network"])'
              exit 0
            fi
            [ -n "$GOT" ] && echo "  serving $GOT, waiting..."
            sleep 15
          done

          echo "::error::$URL is not serving $WANT after 10 minutes (last saw '${GOT:-no response}')"
          exit 1
